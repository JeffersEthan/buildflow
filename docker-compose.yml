services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildflow
      POSTGRES_PASSWORD: buildflow
      POSTGRES_DB: buildflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildflow -d buildflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://buildflow:buildflow@db:5432/buildflow
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-before-production}
      # Auth.js v5 does not trust request hosts in production (NODE_ENV=production)
      # unless told to. Required for sign-in to work in the Docker deployment.
      AUTH_TRUST_HOST: "true"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
